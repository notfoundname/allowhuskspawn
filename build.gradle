plugins {
    id "java"
    id "io.papermc.paperweight.userdev" version "2.0.0-beta.24"
}

group = "com.notfoundname"
version = "1.1-SNAPSHOT"
description = "Makes Husks follow Zombies' spawn rules."

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
    maven {
        name = "canvasmcPublic"
        url = uri("https://maven.canvasmc.io/public")
    }
}

dependencies {
    paperweight.paperDevBundle("26.3.build.+")
    compileOnly "space.vectrix.ignite:ignite-api:1.2.1"
    compileOnly "io.canvasmc.horizon:core:1.0.0+90"
    compileOnly "net.fabricmc:sponge-mixin:0.17.0+mixin.0.8.7"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
}

tasks {
    compileJava {
        options.release = 25
    }
    processResources {
        filesMatching("*.json") {
            expand ([ "version" : version,
                      "description" : description ])
        }
    }
}